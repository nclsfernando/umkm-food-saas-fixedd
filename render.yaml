# Render Blueprint — NestJS API (free) + Render Postgres (free)
# Connect repo: https://dashboard.render.com/blueprint/new?repo=https://github.com/nclsfernando/umkm-food-saas-fixedd
# Auto-deploys on push to the linked branch after Blueprint is created.
# DATABASE_URL is wired automatically from the Blueprint Postgres instance.

services:
  - type: web
    name: umkm-food-saas-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: FRONTEND_URL
        value: https://umkm-food-saas-fixedd.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: umkm-food-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

databases:
  - name: umkm-food-db
    plan: free
    region: singapore
    databaseName: umkm_food
    postgresMajorVersion: "16"
