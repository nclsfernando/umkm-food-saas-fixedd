# Render Blueprint — NestJS API (free) + Neon Postgres (external)
# Connect repo: https://dashboard.render.com/blueprint/new?repo=https://github.com/nclsfernando/umkm-food-saas-fixedd
# Auto-deploys on push to the linked branch after Blueprint is created.
# DATABASE_URL: set manually in Render dashboard to your Neon pooled connection string.

services:
  - type: web
    name: umkm-food-saas-api
    runtime: docker
    plan: free
    # Dockerfile COPY paths assume backend/ as build context (not monorepo root)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: FRONTEND_URL
        value: https://umkm-food-saas-fixedd.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
