name: Deploy

on:
  push:
    branches: [main]

jobs:
  # Vercel Git integration usually deploys the frontend automatically.
  # This job only syncs DATABASE_URL when VERCEL_* secrets are present.
  sync-vercel-env:
    name: Sync DATABASE_URL → Vercel (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync env if Vercel token exists
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$DATABASE_URL" ]; then
            echo "VERCEL_TOKEN or DATABASE_URL secret missing — skip sync."
            echo "Rely on Vercel Git integration + dashboard env for DATABASE_URL."
            exit 0
          fi
          npm install -g vercel@39
          cd frontend
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel env rm DATABASE_URL production --yes --token="$VERCEL_TOKEN" || true
          printf '%s' "$DATABASE_URL" | vercel env add DATABASE_URL production --token="$VERCEL_TOKEN"
          vercel env rm NEXT_PUBLIC_API_URL production --yes --token="$VERCEL_TOKEN" || true
          printf '%s' '/api/v1' | vercel env add NEXT_PUBLIC_API_URL production --token="$VERCEL_TOKEN"
          echo "Synced DATABASE_URL + NEXT_PUBLIC_API_URL to Vercel production."
