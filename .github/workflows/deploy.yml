name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Backend: Zeabur auto-deploys from Git when the service is connected ─────
  # Optional: set ZEABUR_DEPLOY_HOOK (or webhook URL) secret to trigger redeploy.
  deploy-backend:
    name: Deploy Backend → Zeabur (optional)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Zeabur deploy hook (optional)
        env:
          ZEABUR_DEPLOY_HOOK: ${{ secrets.ZEABUR_DEPLOY_HOOK }}
        run: |
          if [ -z "${ZEABUR_DEPLOY_HOOK}" ]; then
            echo "ZEABUR_DEPLOY_HOOK not set — skipping CI trigger."
            echo "Zeabur should auto-deploy from Git when the service is connected."
            echo "Dashboard: https://zeabur.com"
            exit 0
          fi
          curl -fsS -X POST "${ZEABUR_DEPLOY_HOOK}"
          echo "Zeabur deploy hook triggered."

  # ── Deploy Frontend to Vercel ──────────────────────────────────────────────
  # Runs even when deploy-backend fails so Vercel is not blocked by backend CI.
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          cd frontend
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
