name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Backend: Render auto-deploys from Blueprint/Git ─────────────────────────
  # Optional: set RENDER_DEPLOY_HOOK secret to trigger a deploy hook via curl.
  # Primary path is Render auto-deploy after connecting the Blueprint.
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook (optional)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK not set — skipping CI trigger."
            echo "Render should auto-deploy from the Blueprint when the repo is connected."
            echo "Blueprint: https://dashboard.render.com/blueprint/new?repo=https://github.com/nclsfernando/umkm-food-saas-fixedd"
            exit 0
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}"
          echo "Render deploy hook triggered."

  # ── Deploy Frontend to Vercel ──────────────────────────────────────────────
  # Runs even when deploy-backend fails so Vercel is not blocked by backend CI.
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          cd frontend
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
